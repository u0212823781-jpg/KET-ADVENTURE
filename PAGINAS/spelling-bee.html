<script>
/* ---------- helpers ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function normText(s) {
  return (s || '').toUpperCase().trim().replace(/\s+/g, ' ');
}
function normDigits(s) {
  return (s || '').replace(/\D/g, '');
}
function normPrice(s) {
  return (s || '').toLowerCase().trim().replace('£', '').replace(/\s+/g, '');
}

/* ---------- speech ---------- */
function speak(text) {
  if (!window.speechSynthesis) { alert("Sorry, your browser can't play audio for this."); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = 0.78; u.pitch = 1.05;
  const voices = window.speechSynthesis.getVoices();
  const gb = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang && v.lang.startsWith('en'));
  if (gb) u.voice = gb;
  window.speechSynthesis.speak(u);
}

/* ---------- spelling / number helpers (also used to build the data below) ---------- */
function spellLetters(word) {
  const letters = word.toUpperCase().split('');
  const parts = [];
  for (let i = 0; i < letters.length; i++) {
    if (letters[i] === letters[i - 1]) parts[parts.length - 1] = 'double ' + letters[i];
    else parts.push(letters[i]);
  }
  return parts.join(', ');
}
function digitWord(d) {
  return d === '0' ? 'oh' : ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'][+d];
}
function phoneSpeech(numStr) {
  const digits = numStr.replace(/\D/g, '').split('');
  const out = [];
  for (let i = 0; i < digits.length; i++) {
    if (digits[i] === digits[i - 1]) out[out.length - 1] = 'double ' + digitWord(digits[i]);
    else out.push(digitWord(digits[i]));
  }
  return out.join(', ');
}
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function numberWords(n) {
  if (n < 20) return ONES[n];
  const t = Math.floor(n / 10), o = n % 10;
  return TENS[t] + (o ? '-' + ONES[o] : '');
}
function priceWords(pounds, pence) {
  if (pounds === 0) return numberWords(pence) + ' pence';
  if (pence === 0) return numberWords(pounds) + ' pound' + (pounds === 1 ? '' : 's');
  return numberWords(pounds) + ' pound' + (pounds === 1 ? '' : 's') + ' ' + numberWords(pence);
}

/* ---------- per-item check/reset toggle ---------- */
function addItemCheckButton(container, onCheck, onReset) {
  function renderCheckBtn() {
    const btn = el('button', 'item-check', 'Check ✔');
    btn.type = 'button';
    btn.addEventListener('click', () => { onCheck(); btn.replaceWith(renderResetBtn()); });
    return btn;
  }
  function renderResetBtn() {
    const btn = el('button', 'item-check item-reset', '🔄 Try again');
    btn.type = 'button';
    btn.addEventListener('click', () => { onReset(); btn.replaceWith(renderCheckBtn()); });
    return btn;
  }
  container.appendChild(renderCheckBtn());
}
function updatePartScore(partEl) {
  if (!partEl) return;
  const items = partEl.querySelectorAll('[data-kind]');
  const total = items.length;
  let graded = 0, correct = 0;
  items.forEach(it => { if (it.dataset.graded === '1') { graded++; if (it.dataset.correct === '1') correct++; } });
  const scoreEl = partEl.querySelector('.score');
  if (scoreEl) {
    if (graded === 0) { scoreEl.textContent = ''; scoreEl.classList.remove('good'); }
    else {
      const perfect = graded === total && correct === total;
      scoreEl.textContent = `${correct} / ${total} correct${perfect ? ' 🎉' : ''}`;
      scoreEl.classList.toggle('good', perfect);
    }
  }
}

/* ---------- generic "listen and type" builder (used by every activity) ---------- */
function buildListenType(part) {
  const wrap = el('div');
  part.items.forEach(item => {
    const row = el('div', 'item-row'); row.dataset.kind = 'bee';
    row.appendChild(el('span', 'item-num', item.num + '. ' + (item.label || '')));
    const sbtn = el('button', 'speak-btn', '🔊 Listen');
    sbtn.type = 'button';
    sbtn.addEventListener('click', () => speak(item.speakText));
    row.appendChild(sbtn);

    const input = document.createElement('input');
    input.type = 'text'; input.className = 'bee-input'; input.placeholder = item.placeholder || 'Type here...';
    row.appendChild(input);
    const ans = el('span', 'bee-answer', '(' + item.accepted[0] + ')');
    row.appendChild(ans);

    addItemCheckButton(row,
      () => {
        const val = item.normalize(input.value);
        const ok = item.accepted.map(item.normalize).includes(val) && val !== '';
        input.classList.toggle('correct', ok); input.classList.toggle('incorrect', !ok);
        input.disabled = true; ans.classList.add('show');
        row.dataset.graded = '1'; row.dataset.correct = ok ? '1' : '0';
        updatePartScore(row.closest('.part'));
      },
      () => {
        input.value = ''; input.disabled = false; input.classList.remove('correct', 'incorrect'); ans.classList.remove('show');
        delete row.dataset.graded; delete row.dataset.correct;
        updatePartScore(row.closest('.part'));
      }
    );
    wrap.appendChild(row);
  });
  return wrap;
}

function buildPart(part) {
  const section = el('section', 'part'); section.id = part.id;
  const head = el('div', 'part-head');
  head.appendChild(el('span', 'badge', part.number));
  head.appendChild(el('h3', null, part.title));
  section.appendChild(head);
  const body = el('div');
  if (part.instructions) body.appendChild(el('p', 'instructions', part.instructions));
  if (part.tip) { const tip = el('div', 'tip'); tip.innerHTML = `<b>⭐ Tip:</b> <span>${part.tip}</span>`; body.appendChild(tip); }
  body.appendChild(buildListenType(part));

  const actions = el('div', 'part-actions');
  const checkBtn = el('button', 'btn', '✅ Check my answers');
  checkBtn.type = 'button';
  const resetBtn = el('button', 'btn ghost', '🔄 Try again');
  resetBtn.type = 'button'; resetBtn.style.display = 'none';
  checkBtn.addEventListener('click', () => {
    section.querySelectorAll('.item-check:not(.item-reset)').forEach(b => b.click());
    checkBtn.disabled = true; checkBtn.textContent = '✔️ Checked';
    resetBtn.style.display = 'inline-block';
  });
  resetBtn.addEventListener('click', () => {
    const fresh = buildPart(part);
    section.replaceWith(fresh);
  });
  actions.appendChild(checkBtn); actions.appendChild(resetBtn); actions.appendChild(el('span', 'score', ''));
  body.appendChild(actions);
  section.appendChild(body);
  return section;
}

function buildReference(sec) {
  const wrap = el('div', 'part'); wrap.id = sec.id;
  const head = el('div', 'part-head');
  head.appendChild(el('span', 'badge', '📚'));
  head.appendChild(el('h3', null, sec.title));
  wrap.appendChild(head);

  const table = document.createElement('table'); table.className = 'alpha-table';
  table.innerHTML = `<tr><th>Sound-alike group</th><th>Letters</th></tr>` +
    sec.groups.map(g => `<tr><td>${g.name}</td><td><b>${g.letters}</b></td></tr>`).join('');
  wrap.appendChild(table);

  const warn = el('div', 'warn-box');
  warn.innerHTML = `<b>⚠️ Careful!</b> ${sec.warning}`;
  wrap.appendChild(warn);
  return wrap;
}

          { num: 6, label: 'Price:', speakText: `The ticket is ${priceWords(0, 60)}.`, accepted: ['0.60', '£0.60', '.60', '60p'], normalize: normPrice, placeholder: 'Type here...' },
          { num: 7, label: 'Street:', speakText: `The address is Hillcrest Avenue. That's spelled ${spellLetters('HILLCREST')}.`, accepted: ['HILLCREST'], normalize: normText, placeholder: 'Type here...' },
          { num: 8, label: 'Phone number:', speakText: `The number is ${phoneSpeech('01904667522')}.`, accepted: ['01904667522'], normalize: normDigits, placeholder: 'Type here...' },
        ],
      }],
    },
  ],
};

/* ==================== RENDER ==================== */
function render() {
  document.getElementById('intro-text').textContent = BEE_DATA.intro;
  const main = document.getElementById('sections');
  main.appendChild(buildReference(BEE_DATA.reference));
  BEE_DATA.sections.forEach(sec => {
    const head = el('div', 'section-head');
    head.appendChild(el('h2', null, sec.label));
    if (sec.description) head.appendChild(el('p', null, sec.description));
    main.appendChild(head);
    sec.parts.forEach(part => main.appendChild(buildPart(part)));
  });
}
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
render();
</script>
</body>
